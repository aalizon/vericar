services:
  vericar:
    build:
      context: .
      dockerfile: Dockerfile
    image: vericar-europe:latest
    container_name: vericar-europe
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATA_DIR: /app/data
      TRUST_PROXY: "1"
    volumes:
      - vericar_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  vericar_data:
    driver: local
